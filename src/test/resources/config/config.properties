# Base URL of the API under test.
# Override at runtime with -Dapi.base.url=https://your-api.example.com
api.base.url=https://jsonplaceholder.typicode.com

# Request timeout in milliseconds (default: 30 seconds).
# Override at runtime with -Dapi.timeout.ms=60000
api.timeout.ms=30000
